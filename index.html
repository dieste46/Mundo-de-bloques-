<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bloques">
<title>Mundo de Bloques</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: mundo ancho con flechas para explorar; arriba el reto con dibujos; abajo bloques y herramientas solo con iconos (no hace falta leer) */
@font-face{font-family:"Press Start 2P";src:url(fonts/press-start-2p.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  --sky:#7ec8f2; --panel:#3b2a1e; --panel-2:#5a3f2b; --slot:#2a1d14; --ink:#fff6e0; --sel:#ffd43b; --sel-edge:#b8860b;
  --glass:rgba(42,29,20,.82);
  --pixel:"Press Start 2P", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
/* Safari anterior a iOS 14.5 no separa con "gap" los elementos de una fila o columna flexible; el script lo detecta,
   marca la página con .sin-gap y aquí se separan con márgenes para que no salgan pegados */
.sin-gap #bar>*+*,.sin-gap #mundosCard>*+*,.sin-gap #mundosList>*+*{margin-top:10px}
.sin-gap #hud>*+*,.sin-gap #tab>*+*{margin-top:8px}
.sin-gap #vozCard>*+*{margin-top:12px}.sin-gap #vozList>*+*{margin-top:6px}
.sin-gap #blocks>*+*,.sin-gap #flechas>*+*,.sin-gap #reto>*+*,.sin-gap #stars>*+*,.sin-gap .mundo>*+*{margin-left:8px}
.sin-gap #tools>*+*,.sin-gap .vrow>*+*,.sin-gap #retoOpc>*+*{margin-left:6px}
.sin-gap #zoomDots>*+*{margin-left:4px}
.sin-gap #retoSlots .s,.sin-gap #fila .f{margin:2px}
html,body{height:100%;margin:0;overflow:hidden;background:var(--panel);color:var(--ink);font-family:var(--pixel);touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* viewport-fit=cover: el juego se queda dentro de la zona segura (muesca, esquinas) y el marco se pinta del color del panel */
#app{display:flex;flex-direction:column;height:100%;box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#world{flex:1;min-height:0;position:relative;background:var(--sky);touch-action:none;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* estrellas ganadas */
#stars{position:absolute;left:10px;top:10px;background:var(--glass);padding:8px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
#stars .e{font-family:system-ui;font-size:16px}
#stars.gana{animation:estrella .8s;transform-origin:0 50%;-webkit-transform-origin:0 50%}
@keyframes estrella{25%{transform:scale(1.5)}50%{transform:scale(.94)}75%{transform:scale(1.12)}}

/* ajustes de voz y nivel (para el adulto) */
/* columna de la izquierda: estrellas, ajustes (para el adulto) y deshacer */
#vozBtn{top:52px}#undoBtn{top:104px}#undoBtn.off{opacity:.4}#zoomBtn{top:156px}
/* bajo la lupa, tres puntos de distinto tamaño: el encendido es el tamaño de bloque que se ve */
#zoomDots{position:absolute;left:10px;top:202px;width:44px;display:flex;justify-content:center;align-items:center;gap:4px;pointer-events:none}
#zoomDots i{display:block;background:var(--ink);opacity:.35}#zoomDots i:nth-child(1){width:10px;height:10px}#zoomDots i:nth-child(2){width:7px;height:7px}#zoomDots i:nth-child(3){width:5px;height:5px}
#zoomDots i.on{opacity:1;background:var(--sel)}
#vozBtn,#undoBtn,#zoomBtn{position:absolute;left:10px;width:44px;height:44px;border:3px solid var(--slot);background:var(--glass);padding:0;font-size:20px;font-family:system-ui}
#voz,#mundos{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,12,6,.7);display:grid;place-items:center;padding:16px;z-index:5}
/* selector de mundos: tres huecos con su miniatura; el 🔄 de la derecha (cambiarlo por uno nuevo) es para el adulto */
#mundosCard{background:var(--panel);border:4px solid var(--sel);width:min(100%,460px);max-height:100%;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y}
#mundosList{display:flex;flex-direction:column;gap:10px}
.mundo{display:flex;gap:8px;align-items:stretch}
.mcard{flex:1;min-width:0;position:relative;padding:0;border:4px solid var(--slot);background:var(--slot);display:block}
.mundo.sel .mcard{border-color:var(--sel)}
.mcard canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.mplus{display:grid;place-items:center;width:100%;min-height:90px;aspect-ratio:3/1;font-size:34px;font-family:system-ui;background:var(--panel-2)}
.mnum{position:absolute;left:6px;top:6px;background:var(--glass);padding:5px 8px;font-size:14px}
.mnew{flex:0 0 44px;border:3px solid var(--slot);background:var(--panel-2);font-size:18px;font-family:system-ui;padding:0;opacity:.7}
#vozCard{background:var(--panel);border:4px solid var(--sel);width:min(100%,420px);max-height:100%;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;gap:12px;
  font-family:system-ui,sans-serif;font-size:15px;overflow-y:auto;touch-action:pan-y}
#vozCard h2{margin:0;font-family:var(--pixel);font-size:13px}
#vozCard p{margin:0;line-height:1.4}
#vozList{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:52px;touch-action:pan-y}
.vrow{display:flex;gap:6px}
.vopt{flex:1;min-width:0;min-height:44px;background:var(--panel-2);border:3px solid var(--slot);padding:8px 10px;text-align:left;font-family:system-ui,sans-serif;font-size:15px}
.vrow .vopt{text-align:center}
.vopt small{opacity:.7}
.vopt[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-edge);color:var(--slot)}
.vlabel{font-size:12px;opacity:.8;margin-bottom:-6px}
#palIn{flex:2;min-width:0;min-height:44px;box-sizing:border-box;padding:8px 10px;border:3px solid var(--slot);background:#fff6e0;color:var(--slot);font:16px system-ui,sans-serif;text-transform:uppercase;-webkit-user-select:text;user-select:text}

/* reto: dibujo + casillas que se van llenando; debajo, el tablero del cerdito cuando toca programarlo */
#hud{position:absolute;left:16px;right:16px;top:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
/* el reto deja libre la columna de la izquierda (estrellas y ajustes); en pantallas anchas se centra dejando lo mismo a la derecha */
#reto{box-sizing:border-box;margin-left:64px;max-width:calc(100% - 64px);background:var(--glass);border:4px solid var(--sel);padding:8px;display:flex;align-items:center;gap:8px}
@media (min-width:700px){#reto{margin:0 64px;max-width:calc(100% - 128px)}}
/* en móvil: botones arriba y casillas debajo, para que diez casillas no ocupen media pantalla */
@media (max-width:519px){#reto{flex-wrap:wrap;justify-content:center}#retoSlots{order:5;flex-basis:100%}#retoSlots.torre{align-items:center}#retoOpc{order:6;flex-basis:100%;justify-content:center}#retoEq{font-size:14px}}
#reto .rb{flex:0 0 auto;width:44px;height:44px;border:3px solid var(--slot);background:var(--panel-2);padding:0;font-size:20px;font-family:system-ui}
#retoIco{flex:0 0 auto;font-size:22px;font-family:system-ui}
#retoNum{flex:0 0 auto;font-size:20px;color:var(--sel)} /* la cifra del reto, para unir cantidad y número */
#retoNum.letra{font-size:30px} /* en el reto de letras, la letra bien grande */
/* la cuenta escrita (3 + ? = 7) y los números que se tocan para responder */
#retoEq{flex:0 0 auto;font-size:18px;white-space:nowrap}
#retoEq b{font-weight:normal;color:var(--sel)}
#reto.done #retoEq,#reto.done #retoEq b{color:var(--slot)}
#retoOpc{display:flex;gap:6px}
#retoOpc .opc{width:52px;height:52px;border:3px solid var(--slot);background:var(--panel-2);font-size:20px;padding:0}
#retoOpc .opc.pista{background:var(--sel);border-color:var(--sel-edge);color:var(--slot);animation:late 1.2s ease-in-out infinite}
#retoOpc .opc.mal{animation:tiembla .35s 2}
#reto.done #retoNum{color:var(--slot)}
#retoSlots{display:flex;flex-wrap:wrap;gap:4px;min-width:0;justify-content:center}
#retoSlots:empty{display:none}
#retoSlots.torre{flex-direction:column-reverse;flex-wrap:nowrap}
#retoSlots .s{width:22px;height:22px;opacity:.28;display:grid;place-items:center;font-family:system-ui;font-size:16px;outline:2px dashed var(--ink);outline-offset:-2px}
#retoSlots .s canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#retoSlots .s.on{opacity:1;outline:2px solid var(--sel)}
#retoSlots .s.ask{opacity:1}
#retoSlots .s.quita{transform:scale(.75);outline-style:dotted}
#reto.done{background:var(--sel);color:var(--slot)}

/* tablero del cerdito: cuadrícula, y debajo la fila de flechas que se va llenando */
#tab{box-sizing:border-box;max-width:100%;background:var(--glass);border:4px solid var(--slot);padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
#tabGrid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--c));grid-auto-rows:var(--c);border:4px solid #9c6a3c}
#tabGrid .c{display:grid;place-items:center;background:#6fbe4f}
#tabGrid .c.alt{background:#62ad45}
#tabGrid .c canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#tabGrid .c.meta canvas{width:70%;height:70%}
#tabPig{position:absolute;left:0;top:0;width:var(--c);height:var(--c);pointer-events:none;transition:transform .45s ease-in-out}
#tabPig canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#tabPig.feliz canvas{animation:salto .5s ease-out 3}
@keyframes salto{50%{transform:translateY(-25%)}}
#fila{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:max(calc(var(--c)*var(--cols)),148px)}
#fila .f{box-sizing:border-box;width:34px;height:34px;display:grid;place-items:center;font-family:system-ui;font-size:20px;border:2px dashed var(--ink);opacity:.45}
#fila .f.on{opacity:1;border-style:solid;background:var(--panel-2)}
#fila .f.pista{opacity:.8;border-color:var(--sel);animation:late 1.2s ease-in-out infinite}
#fila .f.now{background:var(--sel);border-color:var(--sel-edge)}
#fila .f.mal{border:3px dashed var(--sel);animation:tiembla .35s 2}
/* pantallas bajas (móvil tumbado): la fila de flechas no se parte en dos y todo va más apretado, para que quepa */
@media (max-height:520px){#tab{padding:4px;gap:4px}#fila{max-width:none}#fila .f{width:28px;height:28px;font-size:16px}
  #world.prog #toast,#world.conreto #toast{display:none}} /* ahí el texto taparía el tablero o el marco del reto; la instrucción se sigue diciendo en voz alta */
@keyframes late{50%{opacity:.4}}
@keyframes tiembla{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* Por abajo, en los iPhone con raya de inicio se deja el 60 % de la zona segura: lo justo para que los botones no pisen la raya
   (20 px en vertical, 13 tumbado) sin regalarle una franja vacía. Donde no hay raya, o el navegador no entiende max(), quedan 10 px. */
#bar{background:var(--panel);border-top:4px solid var(--panel-2);padding:10px 12px;padding-bottom:max(10px,calc(env(safe-area-inset-bottom,0px)*.6));
  display:flex;flex-direction:column;gap:10px}
#blocks{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;touch-action:pan-x}
#blocks::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:54px;height:54px;border:4px solid var(--slot);background:var(--slot);padding:0}
.slot canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.slot[aria-pressed="true"]{border-color:var(--sel);transform:translateY(-4px)}
/* mientras se programa al cerdito, las flechas ocupan el sitio de los bloques (misma altura, el mundo no se mueve) */
#flechas{display:flex;gap:8px;padding:4px 0 2px}
.fl{flex:1;min-width:0;height:54px;background:var(--panel-2);border:4px solid var(--slot);padding:0;font-size:24px;font-family:system-ui}
#fGo{background:#5cb83a;border-color:#2b6e24;color:#fff}
#tools{display:flex;gap:6px}
.tool{flex:1;min-width:0;height:52px;background:var(--panel-2);border:4px solid var(--slot);padding:0;font-size:24px;font-family:system-ui}
.tool[aria-pressed="true"],.tool.ask{background:var(--sel);border-color:var(--sel-edge)}
#tReto.call{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{background:var(--sel);border-color:var(--sel-edge)}}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:var(--glass);color:var(--ink);
  font-size:11px;line-height:1.5;padding:10px 14px;pointer-events:none;opacity:0;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slot[aria-pressed="true"]{transform:none}#toast{transition:none}#tReto.call{animation:none}
  #tabPig{transition:none}#tabPig.feliz canvas,#fila .f.pista,#fila .f.mal{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <canvas id="cv"></canvas>
    <div id="stars" aria-label="Estrellas ganadas"><span class="e">⭐</span><span id="starN">0</span></div>
    <div id="hud">
      <div id="reto" hidden>
        <button class="rb" id="rSay" aria-label="Repetir el reto">🔊</button>
        <span id="retoIco"></span>
        <span id="retoNum" hidden></span>
        <span id="retoEq" hidden></span>
        <div id="retoSlots"></div>
        <div id="retoOpc" hidden></div>
        <button class="rb" id="rHard" aria-label="Más difícil">💪</button>
        <button class="rb" id="rClose" aria-label="Dejar el reto">✖</button>
      </div>
      <div id="tab" hidden>
        <div id="tabGrid" aria-label="Tablero del cerdito"></div>
        <div id="fila" aria-label="Fila de flechas"></div>
      </div>
    </div>
    <button id="vozBtn" aria-label="Ajustes: voz y nivel de los retos">🗣️</button>
    <button id="undoBtn" class="off" aria-label="Deshacer lo último">↩️</button>
    <button id="zoomBtn" aria-label="Tamaño de los bloques">🔍</button>
    <div id="zoomDots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="toast"></div>
  </div>
  <div id="mundos" hidden>
    <div id="mundosCard" role="dialog" aria-label="Elige un mundo">
      <div id="mundosList"></div>
      <button class="vopt" id="mundosClose" style="text-align:center" aria-label="Cerrar">✖</button>
    </div>
  </div>
  <div id="voz" hidden>
    <div id="vozCard" role="dialog" aria-label="Ajustes del juego">
      <h2>Ajustes</h2>
      <div class="vlabel">Sonido (en "solo retos" la voz no nombra cada botón que se toca)</div>
      <div class="vrow" id="vozSon"></div>
      <div class="vlabel">Voz</div>
      <div id="vozList"></div>
      <div class="vlabel">Velocidad</div>
      <div class="vrow" id="vozRate"></div>
      <div class="vlabel">Tono</div>
      <div class="vrow" id="vozPitch"></div>
      <div class="vlabel">Palabra de la semana (los retos de letras irán sacando sus letras; vacía, letras sueltas)</div>
      <div class="vrow"><input id="palIn" type="text" maxlength="14" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ej.: PATO"><button class="vopt" id="palOk">Guardar</button></div>
      <div class="vlabel">Nivel de partida de los retos (luego sube o baja solo)</div>
      <div class="vrow" id="vozNivel"></div>
      <button class="vopt" id="vozClose" style="text-align:center">Cerrar</button>
      <div class="vlabel" id="vozVer" style="text-align:center;margin:0"></div>
    </div>
  </div>
  <div id="bar">
    <div id="blocks" role="toolbar" aria-label="Bloques"></div>
    <div id="flechas" role="toolbar" aria-label="Flechas para el cerdito" hidden>
      <button class="fl" data-d="1" aria-label="Izquierda">⬅️</button>
      <button class="fl" data-d="2" aria-label="Arriba">⬆️</button>
      <button class="fl" data-d="3" aria-label="Abajo">⬇️</button>
      <button class="fl" data-d="0" aria-label="Derecha">➡️</button>
      <button class="fl" id="fDel" aria-label="Borrar la última flecha">🧽</button>
      <button class="fl" id="fGo" aria-label="¡En marcha!">▶</button>
    </div>
    <div id="tools">
      <button class="tool" id="tPut" aria-label="Poner bloques" aria-pressed="true">🧱</button>
      <button class="tool" id="tDig" aria-label="Picar" aria-pressed="false">⛏️</button>
      <button class="tool" id="tPig" aria-label="Cerditos" aria-pressed="false">🐷</button>
      <button class="tool" id="tHouse" aria-label="Casa" aria-pressed="false">🏠</button>
      <button class="tool" id="tNight" aria-label="Día y noche">🌙</button>
      <button class="tool call" id="tReto" aria-label="Reto nuevo">⭐</button>
      <button class="tool" id="tNew" aria-label="Mis mundos">🌍</button>
    </div>
  </div>
</div>

<script>
(()=>{
const T=16, COLS=48, ROWS=32, MAXPIGS=20;
// El mundo mide 48 × 32 bloques. El suelo queda hacia la mitad (filas SUELO a SUELO+3): por encima hay cielo de sobra para construir alto
// y por debajo, tierra y piedra para picar hondo. Antes medía 16 de alto; SUBE es lo que se desplazan hacia abajo los mundos guardados de entonces.
const SUELO=19, SUBE=10;
const BLOCKS=[
  {id:1,name:'Hierba'},{id:2,name:'Tierra'},{id:3,name:'Piedra'},{id:4,name:'Madera'},
  {id:5,name:'Hojas'},{id:6,name:'Arena'},{id:7,name:'Agua'},{id:8,name:'Ladrillo'},
  {id:9,name:'Cristal'},{id:10,name:'Oro'},{id:11,name:'Flor'},{id:14,name:'Semilla'},{id:12,name:'Nieve'},{id:13,name:'Antorcha'}
];
const PLURAL={2:'bloques de tierra',3:'bloques de piedra',4:'bloques de madera',6:'bloques de arena',8:'ladrillos',9:'cristales',
  10:'bloques de oro',11:'flores',12:'bloques de nieve',13:'antorchas'};
const NUM=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
const NOSOLID={7:1,11:1,13:1,14:1,15:1}, TRANSP={7:.8,9:.55}; // 14 es la semilla plantada y 15 el arbolito en que se convierte (no está en el inventario)

// ¿entiende este navegador "gap" en flex? (dos hijos sin alto en columna con gap de 1px miden 1px si sí)
{const f=document.createElement('div');f.style.cssText='display:flex;flex-direction:column;gap:1px;position:absolute;visibility:hidden';
  f.appendChild(document.createElement('div'));f.appendChild(document.createElement('div'));document.body.appendChild(f);
  if(f.scrollHeight!==1)document.documentElement.classList.add('sin-gap');document.body.removeChild(f)}

// --- texturas pixeladas generadas (16×16) ---
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.max(0,Math.min(255,r*f|0));g=Math.max(0,Math.min(255,g*f|0));b=Math.max(0,Math.min(255,b*f|0));return`rgb(${r},${g},${b})`}
function lienzo(w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv}
// Fondo de un material: su color con manchas suaves de 2×2. Nada de grano píxel a píxel, que acaba pareciendo la nieve de un televisor.
function fondo(c,base,amt,r){for(let y=0;y<T;y+=2)for(let x=0;x<T;x+=2){c.fillStyle=shade(base,1+(r()-.5)*amt);c.fillRect(x,y,2,2)}}
// Pinceladas: n trocitos de un color, de 1 píxel o de hasta "largo" en horizontal (o en vertical). Los que se salen por un borde entran por el otro,
// así el bloque empalma con sus vecinos sin que se vea la junta.
function toques(c,r,col,n,largo=1,vert=false){c.fillStyle=col;for(let i=0;i<n;i++){const x=r()*T|0,y=r()*T|0,l=1+(r()*largo|0),w=vert?1:l,h=vert?l:1;
  c.fillRect(x,y,w,h);c.fillRect(x-T,y,w,h);c.fillRect(x,y-T,w,h)}}

function idx(x,y){return y*COLS+x}
function get(x,y){return(x<0||x>=COLS||y<0||y>=ROWS)?3:grid[idx(x,y)]}

function topOf(x){let y=0;while(y<ROWS&&!grid[idx(x,y)])y++;return y}

function genWorld(){
  grid=new Array(COLS*ROWS).fill(0);
  const r=rng(Date.now()&0xffff);
  let h=SUELO+1;
  for(let x=0;x<COLS;x++){
    if(r()<.35)h+=r()<.5?-1:1;h=Math.max(SUELO,Math.min(SUELO+3,h));
    for(let y=h;y<ROWS;y++)grid[idx(x,y)]=y==h?1:(y<h+3?2:(r()<(y>ROWS-4?.12:.03)?10:3)); // hierba, tres de tierra y piedra con algo de oro, más cuanto más hondo
  }
  // una charca con arena
  const px=6+(r()*(COLS-14)|0);
  for(let dx=0;dx<3;dx++){const t=topOf(px+dx);grid[idx(px+dx,t)]=7;if(t+1<ROWS)grid[idx(px+dx,t+1)]=6}
  // árboles y flores
  for(let x=2;x<COLS-2;x++){
    const top=topOf(x);if(grid[idx(x,top)]!==1)continue;
    if(r()<.14){for(let i=1;i<=3;i++)grid[idx(x,top-i)]=4;
      for(let dx=-1;dx<=1;dx++)for(let dy=4;dy<=5;dy++)if(!grid[idx(x+dx,top-dy)])grid[idx(x+dx,top-dy)]=5;x+=2}
    else if(r()<.15)grid[idx(x,top-1)]=11;
  }
  pigs=[];addPig(COLS/2-3|0);addPig(COLS/2+2|0);
  camC=COLS/2-W/S/2;camR=vista();clampCam(); // empieza mirando al centro, donde están los cerditos, con el suelo en la parte baja de la pantalla
  save();

function addPig(x,y){

  pigs.push({x,y,vx:(Math.random()<.5?-1:1)*.015,vy:0,t:0,joy:0});
}

// --- guardado (solo en este navegador) ---
// Hay tres mundos, cada uno con sus bloques, sus cerditos, su hora y su vista. Las estrellas y los niveles son del niño, no del mundo.
// El mundo en el que se está vive en grid/pigs/night/camC; los otros esperan guardados en `mundos`.
let mundo=0,mundos=[null,null,null],vuelve=false,alVolver=false;
const empaqueta=()=>({grid,pigs:pigs.map(p=>[Math.round(p.x),Math.floor(p.y)]),night,camC,camR,t:Date.now()}); // t: cuándo se guardó, para saber si ha pasado una noche de verdad
const valido=w=>!!w&&Array.isArray(w.grid)&&w.grid.length===COLS*ROWS;
function crece(w){ // un mundo de cuando el mapa tenía 16 filas: se le añade cielo por arriba y piedra (con algo de oro) por abajo, sin tocar lo construido
  if(!w||!Array.isArray(w.grid)||w.grid.length!==COLS*16)return w;
  const g=new Array(COLS*ROWS).fill(0),r=rng(w.grid.reduce((a,v)=>a+v,7));
  for(let i=0;i<COLS*16;i++)g[i+COLS*SUBE]=w.grid[i];
  for(let i=COLS*(16+SUBE);i<g.length;i++)g[i]=r()<.08?10:3;
  return{grid:g,pigs:(w.pigs||[]).map(p=>[p[0],p[1]+SUBE]),night:w.night,camC:w.camC};
}
function save(){try{mundos[mundo]=empaqueta();localStorage.setItem('bloques2',JSON.stringify({mundo,mundos,stars,base,niv}))}catch(e){}}
function abre(w){grid=w.grid;pigs=[];(w.pigs||[]).slice(0,MAXPIGS).forEach(p=>addPig(p[0],p[1]));night=!!w.night;nightAmt=night?1:0;if(typeof w.camC==='number')camC=w.camC;camR=typeof w.camR==='number'?w.camR:vista();
  vuelve=typeof w.t==='number'&&Date.now()-w.t>6*36e5} // seis horas sin tocar este mundo cuentan como una noche (ver tick)
function load(){try{const d=JSON.parse(localStorage.getItem('bloques2'));if(!d)return false;
  if(Array.isArray(d.mundos)){mundos=[0,1,2].map(i=>{const w=crece(d.mundos[i]);return valido(w)?w:null});mundo=mundos[d.mundo|0]?d.mundo|0:mundos.findIndex(Boolean)}
  else if(valido(crece(d))){mundos=[crece({grid:d.grid,pigs:d.pigs,night:d.night,camC:d.camC}),null,null];mundo=0} // guardado de antes, con un solo mundo
  else return false;
  if(mundo<0){mundo=0;return false}
  stars=d.stars|0;
  if(d.niv&&typeof d.niv==='object'){niv=d.niv;base=d.base|0}
  else{const l=d.level|0;base=l<4?0:l<8?4:8;niv={};if(l!==base)['contar','serie','suma','resta','alta','copia','programa'].forEach(f=>niv[f]=[l,0])} // partidas guardadas con el nivel único de antes
  abre(mundos[mundo]);return true}catch(e){}return false}

// zoom: 0 = bloques grandes, 1 = normales, 2 = pequeños. vcfg.zoom es el que elige el niño; zoomAhora el que se ve

const ZOOM=[1.3,1,.76];let zoomAhora=1,zoomAuto=false;
function ponZoom(z,auto){
  z=Math.max(0,Math.min(2,z));if(z===zoomAhora)return false;
  const cx=camC+W/S/2,cy=camR+H/S/2; // se mantiene el centro de lo que se está viendo
  zoomAhora=z;zoomAuto=!!auto;resize();camC=cx-W/S/2;camR=cy-H/S/2;camGoal=camGoalR=null;clampCam();
  if(!auto){vcfg.zoom=z;saveVoz()}
  return true;
}
function cambiaZoom(d){ // d = -1 acerca (bloques más grandes), +1 aleja
  if(!ponZoom(zoomAhora+d,false)){beep(200,.08,'triangle',.06);return}
  beep(d<0?660:440,.07);say(['Bloques grandes','Bloques medianos','Bloques pequeños'][zoomAhora],true,true);

function resize(){

const PALLETRA={A:'árbol',B:'barco',C:'casa',D:'dedo',E:'elefante',F:'foca',G:'gato',H:'helado',I:'iglú',J:'jirafa',K:'koala',L:'luna',M:'mamá',N:'nube',Ñ:'ñu',O:'oso',P:'pato',Q:'queso',R:'ratón',S:'sol',T:'tomate',U:'uva',V:'vaca',W:'web',X:'xilófono',Y:'yoyó',Z:'zapato'};
const POOL=['AEIOU','AEIOUMPLSTND','ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];
// palabra de la semana: la escribe el adulto en ajustes; se guardan solo sus letras, en mayúscula y con sus tildes (para que la voz
// la diga bien y se vea como en el cole); para dibujar cada letra con bloques se usa la letra sin tilde
let palabra={txt:'',i:0};
try{Object.assign(palabra,JSON.parse(localStorage.getItem('bloquesPalabra'))||{})}catch(e){}
const limpiaPalabra=s=>(s||'').toUpperCase().replace(/[^A-ZÑÁÉÍÓÚÜ]/g,'').slice(0,12);
const baseLetra=c=>c==='Ñ'?c:c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function guardaPalabra(){try{localStorage.setItem('bloquesPalabra',JSON.stringify(palabra))}catch(e){}}
const MODELOS=[
  [['AA','BB'],['AB','AB'],['AB','BA'],['A','B','A']],
  [['A.','AA'],['.A.','BBB'],['A.A','BBB'],['AB','BA','AB'],['A.','AB','AA']],
  [['.A.','ABA','BBB'],['A..','AB.','ABC'],['ACA','B.B','BBB'],['AB','BA','AB','BA'],['.A','AB','BC','CC']]
];
function makeModelo(){ // planta el modelo en el cielo y deja al lado, tras una columna libre, la zona donde copiarlo
  const wmax=Math.max(1,Math.floor((W/S-1-120/S)/2)); // que quepan modelo y copia con margen a los lados
  const ids=EDU.slice().sort(()=>Math.random()-.5);
  if(ids.indexOf(9)<3&&ids.indexOf(12)<3)ids.splice(ids.indexOf(12),1); // cristal y nieve juntos se confunden
  for(let t=tier('copia');t>=0;t--){
    const opts=MODELOS[t].filter(m=>m[0].length<=wmax).sort(()=>Math.random()-.5);
    for(const m of opts){
      const w=m[0].length,h=m.length,spot=findSky(w*2+1,h);if(!spot)continue;
      const y0=spot.base-h+1,zx=spot.cs+w+1,ghost=[];
      m.forEach((row,ry)=>[...row].forEach((ch,rx)=>{if(ch==='.')return;const b=ids[ch.charCodeAt(0)-65];
        grid[idx(spot.cs+rx,y0+ry)]=b;ghost.push({x:zx+rx,y:y0+ry,b,miss:0,mx:spot.cs+rx,my:y0+ry})}));
      return{ghost,cs:spot.cs,zx,y0,w,h};
    }
  }
  return null;
}
function enCopia(x,y){ // 1 = casilla del modelo, 2 = casilla de la zona de copia, 0 = fuera
  const r=reto;if(!r||r.won||r.kind!=='copia'||y<r.y0||y>=r.y0+r.h)return 0;
  return x>=r.cs&&x<r.cs+r.w?1:x>=r.zx&&x<r.zx+r.w?2:0;
}

// "programa al cerdito": un tablero pequeño, el cerdito, una manzana y una fila de flechas que el cerdito sigue paso a paso
const DIRS=[{dx:1,dy:0,ico:'➡️',name:'derecha'},{dx:-1,dy:0,ico:'⬅️',name:'izquierda'},{dx:0,dy:-1,ico:'⬆️',name:'arriba'},{dx:0,dy:1,ico:'⬇️',name:'abajo'}];
let tabC=48;
const choca=(t,x,y)=>x<0||y<0||x>=t.cols||y>=t.rows||t.rocas.has(x+','+y);
function ruta(t,sx,sy){ // camino más corto hasta la manzana (búsqueda en anchura): lista de direcciones, o null si no hay
  const prev=new Map([[sx+','+sy,null]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();
    if(x===t.fx&&y===t.fy){const out=[];let k=x+','+y,p;while((p=prev.get(k))){out.unshift(p.d);k=p.k}return out}
    DIRS.forEach((d,di)=>{const nx=x+d.dx,ny=y+d.dy,k=nx+','+ny;if(choca(t,nx,ny)||prev.has(k))return;prev.set(k,{d:di,k:x+','+y});q.push([nx,ny])})}
  return null;
}
function makeTablero(){ // fácil: en línea recta; medio: con una esquina y una piedra; difícil: tablero mayor y varias piedras
  const tr=tier('programa'),cols=tr<2?4:5,rows=3;
  for(let n=0;n<300;n++){
    const t={cols,rows,rocas:new Set(),sx:rand(cols),sy:rand(rows),fx:rand(cols),fy:rand(rows)};
    const dx=Math.abs(t.fx-t.sx),dy=Math.abs(t.fy-t.sy);
    if(tr===0){if(dx&&dy)continue}
    else{if(!dx||!dy)continue;
      for(let k=0;k<(tr===1?1:3);k++){const rx=rand(cols),ry=rand(rows);if((rx!==t.sx||ry!==t.sy)&&(rx!==t.fx||ry!==t.fy))t.rocas.add(rx+','+ry)}}
    const path=ruta(t,t.sx,t.sy);
    if(!path||path.length<[2,3,4][tr]||path.length>7)continue;
    return{...t,path,max:Math.min(8,path.length+tr)};
  }
  const t={cols:4,rows:3,rocas:new Set(),sx:0,sy:1,fx:2,fy:1};return{...t,path:ruta(t,0,1),max:2};
}
function progUI(on){$('tab').hidden=!on;$('flechas').hidden=!on;$('blocks').hidden=on;wrap.classList.toggle('prog',on)}
function renderTab(){
  const r=reto,tab=$('tab'),gr=$('tabGrid');
  const libre=H-$('reto').offsetHeight-108; // alto que queda bajo el reto, quitando bordes, valla y la fila de flechas
  tabC=Math.max(24,Math.min(56,Math.floor(Math.min((W-160)/r.cols,libre/r.rows))));
  tab.style.setProperty('--c',tabC+'px');tab.style.setProperty('--cols',r.cols);gr.textContent='';
  for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++){const c=document.createElement('div');c.className='c'+((x+y)%2?' alt':'');
    if(r.rocas.has(x+','+y))c.appendChild(texCanvas(3));
    else if(x===r.fx&&y===r.fy&&!r.ok){c.classList.add('meta');c.appendChild(texCanvas('manzana'))}
    gr.appendChild(c)}
  const p=document.createElement('div');p.id='tabPig';if(r.ok)p.className='feliz';
  const pc=document.createElement('canvas');pc.width=pc.height=T;p.appendChild(pc);gr.appendChild(p);
  pigTo(r.x,r.y);drawFila();
}
function pigTo(x,y,d){ // coloca el cerdito del tablero; al cambiar de casilla se desliza solo (transición CSS)
  const r=reto,p=$('tabPig');if(!r||!p)return;
  if(d&&d.dx)r.izq=d.dx<0;
  const c=p.firstChild.getContext('2d');c.clearRect(0,0,T,T);c.drawImage(pigImg(r.izq,0,false),0,4);
  p.style.transform=`translate(${x*tabC}px,${y*tabC}px)`;
}
function pista(r){ // tras el segundo intento fallido: las flechas que faltan, marcadas en los huecos de la fila
  const out=[];if(r.fails<2)return out;
  let x=r.sx,y=r.sy;for(const di of r.prog){x+=DIRS[di].dx;y+=DIRS[di].dy;if(choca(r,x,y))return out}
  const p=ruta(r,x,y);if(p&&r.prog.length+p.length<=r.max)p.forEach((d,j)=>out[r.prog.length+j]=d);
  return out;
}
function drawFila(){
  const r=reto,el=$('fila'),g=pista(r);el.textContent='';
  for(let i=0;i<r.max;i++){const s=document.createElement('div'),d=r.prog[i];
    s.className='f'+(d!==undefined?' on':'')+(i===r.now?' now':'')+(i===r.bad?' mal':'');
    if(d!==undefined)s.textContent=DIRS[d].ico;else if(g[i]!==undefined){s.textContent=DIRS[g[i]].ico;s.classList.add('pista')}
    el.appendChild(s)}
}
const progLibre=()=>reto&&reto.kind==='programa'&&!reto.won&&!reto.running?reto:null;
function progAdd(d){
  const r=progLibre();if(!r)return;
  if(r.prog.length>=r.max){say('Ya no caben más flechas. Toca el botón verde, o borra con la esponja.');return}
  r.bad=-1;r.prog.push(d);beep(440+d*60,.06);say(DIRS[d].name,false);drawFila();
}
function progDel(){
  const r=progLibre();if(!r)return;
  if(!r.prog.length){say('Borrar',false,true);return}
  r.bad=-1;r.prog.pop();beep(300,.06);say('Borrar',false,true);drawFila();
}
function progGo(){ // el cerdito sigue las flechas una a una; si no llega no pasa nada: se explica y vuelve a la salida
  const r=progLibre();if(!r)return;
  if(!r.prog.length){say('Primero pon las flechas para el cerdito.');return}
  r.running=true;r.bad=-1;r.izq=false;let i=0;
  const vivo=()=>reto===r;
  const fin=(txt,ayuda)=>{
    r.fails++;const marca=r.fails>=2;
    if(marca){r.prog=[];r.bad=-1} // a la segunda se despeja la fila y aparecen marcadas las flechas del camino
    say(txt+' '+(marca?'Mira, te marco las flechas del camino. Ponlas tú y toca el botón verde.':ayuda));
    r.now=-1;drawFila();
    setTimeout(()=>{if(!vivo())return;r.x=r.sx;r.y=r.sy;r.izq=false;pigTo(r.x,r.y);r.running=false},900);
  };
  const paso=()=>{
    if(!vivo())return;
    if(i>=r.prog.length){const f=ruta(r,r.x,r.y).length;
      return fin(`El cerdito se ha quedado sin flechas. ${f===1?'Le falta un paso':'Le faltan '+NUM[f]+' pasos'} para llegar a la manzana.`,
        r.prog.length<r.max?'Pon más flechas y prueba otra vez.':'Borra con la esponja y prueba otro camino.')}
    const di=r.prog[i],d=DIRS[di],nx=r.x+d.dx,ny=r.y+d.dy;r.now=i;
    if(choca(r,nx,ny)){ // amaga el paso y rebota; la flecha que no vale queda la última, que es la que borra la esponja
      const roca=r.rocas.has(nx+','+ny);r.bad=i;r.prog.length=i+1;drawFila();pigTo(r.x+d.dx*.3,r.y+d.dy*.3,d);beep(150,.12,'triangle',.08);
      setTimeout(()=>vivo()&&pigTo(r.x,r.y),220);
      return setTimeout(()=>vivo()&&fin(roca?'¡Pum! Ahí hay una piedra y el cerdito no puede pasar.':'¡Uy! Por ahí se acaba el corral.',
        'Borra esa flecha con la esponja y pon otra.'),600)}
    drawFila();r.x=nx;r.y=ny;i++;pigTo(nx,ny,d);beep(440+di*60,.06);say(d.name,false);
    if(nx===r.fx&&ny===r.fy)return setTimeout(()=>{if(!vivo())return; // ¡ñam!
      r.running=false;r.now=-1;r.ok=true;r.used=i;oink();renderTab();checkReto()},550);
    setTimeout(paso,700);
  };
  pigTo(r.x,r.y);setTimeout(paso,250);
}
document.querySelectorAll('#flechas [data-d]').forEach(b=>b.onclick=()=>progAdd(+b.dataset.d));
$('fDel').onclick=progDel;$('fGo').onclick=progGo;

function startReto(){
  const kinds=['pon','torre','pica','cerdos','serie','serie','suma','suma','resta','alta','copia','copia','programa','programa','junta','junta','letra','letra'].filter(k=>k!==lastKind);
  let kind=pick(kinds),level=nivel(kind);
  const base=grid.slice();
  let r=crea(kind,level);
  // si no cabe en pantalla, se alejan los bloques un paso (o dos) y se vuelve a intentar; al cerrar el reto se recupera el tamaño elegido
  while(!r&&ZONA.includes(kind)&&zoomAhora<2){ponZoom(zoomAhora+1,true);r=crea(kind,level)}
  if(!r&&zoomAuto)ponZoom(vcfg.zoom,false); // ni así: se vuelve al tamaño elegido y sale un reto de los de siempre
  return startReto2(kind,level,base,r);
}
const ZONA=['serie','suma','resta','alta','copia','junta','letra']; // retos que necesitan un sitio en la pantalla
function crea(kind,level){ // prepara el reto de ese tipo; null si no hay sitio para él
  let r=null;
  if(kind==='serie'){
    const spot=findSky(6,1);
    if(spot){const pat=pick(level<4?['AB']:['AB','AAB','ABB','ABC']),ids=EDU.slice().sort(()=>Math.random()-.5);
      const at=i=>ids[pat.charCodeAt(i%pat.length)-65],seq=[],ghost=[];
      for(let i=0;i<4;i++){grid[idx(spot.cs+i,spot.base)]=at(i);seq.push(at(i))}
      for(let i=4;i<6;i++)ghost.push({x:spot.cs+i,y:spot.base,b:at(i),miss:0});
      r={kind,b:0,n:2,seq,ghost};lookAt(spot.cs,6,spot.base)}
  }else if(kind==='suma'){
    const n=Math.min(10,3+Math.floor(level/2)),k=1+rand(n-1),rows=Math.ceil(k/5),spot=findSky(5,rows);
    if(spot){const b=pick(EDU);stampFrame(spot,k,b,rows);r={kind,b,n,k};lookAt(spot.cs,5,spot.base-rows+1)}
  }else if(kind==='resta'){
    const n0=Math.min(10,4+Math.floor(level/2)),d=1+rand(Math.min(3,1+Math.floor(level/3))),rows=Math.ceil(n0/5),spot=findSky(5,rows);
    if(spot){const b=pick(EDU);stampFrame(spot,n0,b,rows);r={kind,b,n:n0-d,n0,slots:n0};lookAt(spot.cs,5,spot.base-rows+1)}
  }else if(kind==='alta'){
    const k=Math.min(6,2+Math.floor(level/3)),g=findGround(k);
    if(g){const a=pick(EDU),b=pick(EDU.filter(v=>v!==a));for(let i=1;i<=k;i++)grid[idx(g.c,g.t-i)]=a;r={kind,b,n:k+1,k,a};lookAt(g.c,1,g.t-k-2)}
  }else if(kind==='copia'){
    const m=makeModelo();
    if(m){r={kind,b:0,n:m.ghost.length,...m};lookAt(m.cs,m.w*2+1,m.y0)}
  }else if(kind==='junta'){
    // dos torres juntas: a bloques de un tipo y bq de otro, que suman t (fácil hasta 5, medio de 4 a 8, difícil de 6 a 10)
    const [lo,hi]=[[2,5],[4,8],[6,10]][tier('junta')],t=lo+rand(hi-lo+1),amin=Math.max(1,t-5),a=amin+rand(Math.min(5,t-1)-amin+1),bq=t-a;
    const spot=findSky(3,Math.max(a,bq));
    if(spot){const A=pick(EDU),B=pick(EDU.filter(v=>v!==A&&!(A===9&&v===12)&&!(A===12&&v===9))),cells=[]; // cristal y nieve juntos se confunden
      for(let i=0;i<a;i++)cells.push({x:spot.cs,y:spot.base-i,b:A});
      for(let i=0;i<bq;i++)cells.push({x:spot.cs+2,y:spot.base-i,b:B});
      cells.forEach(c=>grid[idx(c.x,c.y)]=c.b);
      const otros=[t-2,t-1,t+1,t+2].filter(v=>v>=1&&v<=10).sort(()=>Math.random()-.5).slice(0,2);
      r={kind,b:0,n:1,slots:0,a,bq,A,B,t,cells,cont:[],cs:spot.cs,bs:spot.base,opts:[t,...otros].sort(()=>Math.random()-.5)};
      lookAt(spot.cs,3,spot.base-Math.max(a,bq)+1)}
  }else if(kind==='letra'){
    // con palabra de la semana va sacando sus letras por orden; si no, una al azar del grupo que toca por nivel
    const conPal=palabra.txt.length>0,pos=conPal?palabra.i%palabra.txt.length:-1,L=conPal?baseLetra(palabra.txt[pos]):pick([...POOL[tier('letra')]]);
    const pat=LETRAS[L],w=pat[0].length,hh=pat.length,spot=findSky(w,hh);
    if(spot){const ghost=[],y0=spot.base-hh+1;
      pat.forEach((row,ry)=>[...row].forEach((ch,rx)=>{if(ch==='X')ghost.push({x:spot.cs+rx,y:y0+ry,b:0,miss:0})})); // b:0 = vale cualquier bloque
      r={kind,b:0,n:ghost.length,ghost,L,pal:conPal?palabra.txt:'',pos};
      lookAt(spot.cs,w,y0)}
  }else if(kind==='programa'){
    const t=makeTablero();
    r={kind,b:0,n:1,...t,x:t.sx,y:t.sy,prog:[],fails:0,now:-1,bad:-1};
  }
  return r;
}
function startReto2(kind,level,base,r){
  if(!r){ // retos de siempre (y recurso si no hay sitio en el cielo)
    if(!['pon','torre','pica','cerdos'].includes(kind))kind='pon';
    level=nivel(kind);
    let n=Math.min(10,2+Math.floor(level/2)),b=0;
    if(kind==='cerdos'){n=Math.min(n,5);if(pigs.length+n>MAXPIGS)kind='pon'}
    if(kind==='pica'){b=pick([3,2]);if(countOf(b)<12)kind='pon'}
    if(kind==='torre'){b=pick([8,9,12,6,10]);n=Math.max(3,Math.min(n,7))}
    if(kind==='pon')b=pick([10,8,9,12,6,11,13,4]);
    r={kind,b,n};
  }
  r.base=base;r.dug=0;r.added=0;if(r.slots===undefined)r.slots=r.n;
  lastKind=r.kind;reto=r;r.shown=r.ini=progress(r);
  antes=null;$('undoBtn').classList.add('off'); // el reto planta bloques: lo de antes ya no se puede deshacer
  $('tReto').classList.remove('call');
  renderReto();
  if(camFila!==null){camGoalR=Math.max(0,Math.min(ROWS-H/S,camFila-($('reto').offsetHeight+26)/S));camFila=null}
  say(phrase(r));save();
}
function phrase(r){
  const p='A ver si eres capaz de ';
  if(r.kind==='pon')return p+`poner ${NUM[r.n]} ${PLURAL[r.b]}.`;
  if(r.kind==='torre')return p+`hacer una torre de ${NUM[r.n]} ${PLURAL[r.b]}, uno encima de otro.`;
  if(r.kind==='pica')return p+`picar ${NUM[r.n]} ${PLURAL[r.b]}.`;
  if(r.kind==='serie')return p+`seguir la serie: ${r.seq.map(i=>NAME[i]).join(', ')}. ¿Qué toca ahora?`;
  if(r.kind==='suma')return `Hay ${r.k===1?'un '+SING[r.b]:NUM[r.k]+' '+PLURAL[r.b]}. `+p+`que haya ${NUM[r.n]}.`;
  if(r.kind==='resta')return `Hay ${NUM[r.n0]} ${PLURAL[r.b]}. `+p+`dejar solo ${NUM[r.n]}. Usa el pico.`;
  if(r.kind==='alta')return `Esta torre tiene ${NUM[r.k]} ${PLURAL[r.a]}. `+p+`hacer una más alta con ${PLURAL[r.b]}.`;
  if(r.kind==='copia')return p+'hacer una construcción igual que esta en el cuadro amarillo.';
  if(r.kind==='junta'){const q=(n,b)=>n===1?'un '+SING[b]:NUM[n]+' '+PLURAL[b];return `Aquí hay ${q(r.a,r.A)} y ${q(r.bq,r.B)}. ¿Cuántos son en total? Toca el número.`}
  if(r.kind==='letra'){const d=DILETRA[r.L];
    return (r.pal?`La palabra de esta semana es ${r.pal.toLowerCase()}. Vamos a hacer la ${d}, de ${r.pal.toLowerCase()}.`:`Vamos a hacer la ${d}, de ${PALLETRA[r.L]}.`)+' Rellena la letra con bloques.'}
  if(r.kind==='programa')return p+'llevar al cerdito hasta la manzana. Pon las flechas y toca el botón verde.';
  return p+`poner ${NUM[r.n]} cerditos.`;
}
function winText(r){
  const cap=s=>s[0].toUpperCase()+s.slice(1);
  if(r.kind==='serie')return '¡Has seguido la serie!';
  if(r.kind==='suma')return `${cap(NUM[r.k])} y ${NUM[r.n-r.k]} son ${NUM[r.n]}.`;
  if(r.kind==='junta')return `${cap(NUM[r.a])} y ${NUM[r.bq]} son ${NUM[r.t]}.`;
  if(r.kind==='letra')return `Has hecho la ${DILETRA[r.L]}. ${cap(DILETRA[r.L])}, de ${r.pal?r.pal.toLowerCase():PALLETRA[r.L]}.`;
  if(r.kind==='resta')return `${cap(NUM[r.n0])} menos ${NUM[r.n0-r.n]} ${r.n===1?'es':'son'} ${NUM[r.n]}.`;
  if(r.kind==='alta')return `Tu torre tiene ${NUM[r.n]} y la otra ${NUM[r.k]}. ${cap(NUM[r.n])} es más que ${NUM[r.k]}.`;
  if(r.kind==='copia')return `Las dos construcciones son iguales: ${NUM[r.n]} bloques, cada uno en su sitio.`;
  if(r.kind==='programa')return `El cerdito ha llegado a la manzana con ${r.used===1?'una flecha':NUM[r.used]+' flechas'}.`;
  return `${cap(NUM[r.n])} ${r.kind==='cerdos'?'cerditos':PLURAL[r.b]}.`;
}
const lleno=g=>g.b?grid[idx(g.x,g.y)]===g.b:!!grid[idx(g.x,g.y)]; // un hueco de reto ya relleno
function progress(r){
  if(r.kind==='pica')return r.dug;
  if(r.kind==='cerdos')return r.added;
  if(r.kind==='programa'||r.kind==='junta')return r.ok?1:0;
  if(r.ghost)return r.ghost.filter(lleno).length; // serie, copia y letra: casillas con el bloque que toca (en la letra, cualquiera)
  const isNew=i=>grid[i]===r.b&&r.base[i]!==r.b;
  if(r.kind==='torre'||r.kind==='alta'){let best=0;for(let x=0;x<COLS;x++){let run=0;for(let y=0;y<ROWS;y++){if(isNew(idx(x,y))){run++;if(run>best)best=run}else run=0}}return best}
  let n=0;for(let i=0;i<grid.length;i++)if(isNew(i))n++;return n;
}

  if(panId===id){panId=null;save()}else if(!d.drag&&!cancelado)act(d)}
if(window.PointerEvent){
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}baja(e.pointerId,e.clientX,e.clientY)});
  cv.addEventListener('pointermove',e=>mueve(e.pointerId,e.clientX,e.clientY));
  cv.addEventListener('pointerup',e=>sube(e.pointerId,false));cv.addEventListener('pointercancel',e=>sube(e.pointerId,true));
}else{ // Safari anterior a iOS 13 (un iPad Air de los primeros) no tiene eventos de puntero ni touch-action: se hace con los de toque
  const cada=(e,f)=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++)f(e.changedTouches[i])};
  cv.addEventListener('touchstart',e=>cada(e,t=>baja(t.identifier,t.clientX,t.clientY)),{passive:false});
  cv.addEventListener('touchmove',e=>cada(e,t=>mueve(t.identifier,t.clientX,t.clientY)),{passive:false});
  cv.addEventListener('touchend',e=>cada(e,t=>sube(t.identifier,false)),{passive:false});
  cv.addEventListener('touchcancel',e=>cada(e,t=>sube(t.identifier,true)),{passive:false});
  cv.addEventListener('mousedown',e=>baja('raton',e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>mueve('raton',e.clientX,e.clientY));window.addEventListener('mouseup',()=>sube('raton',false));
}

// --- dibujo ---
function drawPig(p,asleep){
  const x=p.x*S,y=p.y*S+S*.25;
  ctx.drawImage(pigImg(p.vx<0,!asleep&&Math.floor(p.t/8)%2,asleep),x,y,S,S*.75);
  if(p.joy>0){ctx.fillStyle='#e8414b';ctx.font=`${S*.4}px system-ui`;ctx.fillText('❤',x+S*.3,y-S*.2-(40-Math.min(40,p.joy))*.5)}
  else if(asleep){ctx.fillStyle='#fff6e0';ctx.font=`${S*.28}px "Press Start 2P",monospace`;ctx.fillText('z',x+S*.75,y-S*.1-Math.sin((fr+p.t)/25)*3)}
}
function marco(x,y,w,h,col,dash){ // recuadro con sombra oscura debajo, para que se vea igual de día que de noche
  ctx.setLineDash(dash||[]);ctx.lineWidth=7;ctx.strokeStyle='rgba(42,29,20,.6)';ctx.strokeRect(x,y,w,h);
  ctx.lineWidth=3;ctx.strokeStyle=col;ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);
}
const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
function tick(){
  fr++;
  // Si el aparato va justo (un iPad antiguo), se dibuja con menos resolución: al ser pixelado apenas se nota y el juego va suelto.
  // Se mira la media de lo que tarda cada fotograma y, si no llega a unos 28 por segundo, se baja medio punto (hasta 1) y se vuelve a medir.
  // (El umbral queda por debajo de 30 a propósito: un móvil en modo de bajo consumo va a 30 clavados y bajarle la resolución no le ayudaría.)
  // el mundo reacciona: unas 1700 casillas al azar por segundo (a cada una le toca más o menos una vez por segundo), medido por reloj. Con un reto abierto, nada.
  // Así la nieve tarda un segundo o dos en derretirse y la hierba dos o tres en salir: lo justo para que se vea que ha sido por la antorcha o por el agua.
  if(tAnt&&!reacOff&&!(reto&&!reto.won)){reacMs+=Math.min(100,Date.now()-tAnt);let n=Math.min(60,reacMs/.6|0);reacMs-=n*.6;while(n-->0)reacciona()}
  // al volver a un mundo que lleva horas sin tocarse: ha pasado la noche, así que lo plantado crece y el agua ha hecho lo suyo (sin ruido ni saltitos: ya estaba así)
  if(vuelve&&fr>40){vuelve=false;if(!(reto&&!reto.won)){for(let k=0;k<60000;k++)reacciona(true);if(amanece(true))alVolver=true;save()}}
  {const t=Date.now();if(tAnt)lento=lento*.95+Math.min(100,t-tAnt)*.05;tAnt=t;
    if(lento>36&&fr-frCal>150&&calidad>1){calidad=Math.max(1,Math.min(calidad,window.devicePixelRatio||1)-.5);frCal=fr;lento=16;resize()}}
  if(camGoal!==null){camC+=(camGoal-camC)*.12;if(Math.abs(camGoal-camC)<.02){camC=camGoal;camGoal=null}}
  if(camGoalR!==null){camR+=(camGoalR-camR)*.12;if(Math.abs(camGoalR-camR)<.02){camR=camGoalR;camGoalR=null}}
  clampCam();
  if(fr%30===0&&!document.getElementById('voz').hidden)pintaVer();
  const maxC=COLS-W/S,maxR=ROWS-H/S;
  nightAmt+=((night?1:0)-nightAmt)*.05;const na=nightAmt;
  // cielo
  {const k=H+'|'+Math.round(na*250);if(k!==cieloK){cieloK=k;cieloG=ctx.createLinearGradient(0,0,0,H); // solo se rehace mientras anochece o amanece
    cieloG.addColorStop(0,`rgb(${lerp(95,10,na)},${lerp(180,14,na)},${lerp(236,48,na)})`);
    cieloG.addColorStop(1,`rgb(${lerp(191,44,na)},${lerp(230,52,na)},${lerp(251,110,na)})`)}}
  ctx.fillStyle=cieloG;ctx.fillRect(0,0,W,H);
  if(na>.05){skyStars.forEach(s=>{ctx.globalAlpha=na*(.55+.45*Math.sin(fr/30+s.p));ctx.fillStyle='#fff6e0';ctx.fillRect(s.x*W,s.y*H,s.s,s.s)});ctx.globalAlpha=1}
  // sol que se esconde y luna que sale
  const sx=W-S*2.2,sy=S*.6+na*H;
  ctx.fillStyle='#ffe066';ctx.fillRect(sx,sy,S*1.2,S*1.2);ctx.fillStyle='#fff3a6';ctx.fillRect(sx+S*.25,sy+S*.25,S*.7,S*.7);
  const my=S*.6+(1-na)*H;ctx.fillStyle='#e8ecf4';ctx.fillRect(sx,my,S*1.2,S*1.2);ctx.fillStyle='#c3cad8';ctx.fillRect(sx+S*.2,my+S*.25,S*.3,S*.3);ctx.fillRect(sx+S*.7,my+S*.7,S*.25,S*.25);
  if(!clouds.length)clouds=[0,1,2].map(()=>({x:Math.random()*W,y:20+Math.random()*H*.2,w:60+Math.random()*60}));
  clouds.forEach(c=>{c.x+=.15;if(c.x>W+20)c.x=-c.w-20;ctx.fillStyle=`rgba(255,255,255,${.9-.6*na})`;
    ctx.fillRect(c.x,c.y,c.w,S*.5);ctx.fillRect(c.x+c.w*.2,c.y-S*.3,c.w*.5,S*.35)});

  // mundo
  ctx.save();ctx.translate(-Math.round(camC*S),offY);
  const x0=Math.max(0,Math.floor(camC)),x1=Math.min(COLS-1,Math.floor(camC+W/S));
  const y0=Math.max(0,Math.floor(camR)),y1=Math.min(ROWS-1,Math.floor(camR+H/S));
  // bajo tierra, lo que se pica deja ver roca oscura en vez de cielo
  if(y1>=SUELO+4){const cy=(SUELO+4)*S,g2=ctx.createLinearGradient(0,cy,0,cy+S);g2.addColorStop(0,'rgba(46,33,24,0)');g2.addColorStop(1,'rgba(46,33,24,1)');
    ctx.fillStyle=g2;ctx.fillRect(x0*S,cy,(x1-x0+1)*S,S);ctx.fillStyle='#2e2118';ctx.fillRect(x0*S,cy+S,(x1-x0+1)*S,(y1-SUELO-4)*S)}
  const lights=[],ahora=Date.now(),olas=agua[(ahora/200|0)&15];let saltan=null; // el agua avanza un píxel cada dos décimas de segundo (por reloj)
  if(pops.size&&fr%40===0)pops.forEach((t,k)=>{if(ahora-t>POP)pops.delete(k)}); // los que se quedaron fuera de la vista
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=idx(x,y),v=grid[i];if(!v)continue;
    if(pops.size&&pops.has(i)){const t=(ahora-pops.get(i))/POP;if(t>=1)pops.delete(i);else{if(t>=0)(saltan=saltan||[]).push(x,y,v,t);if(v===13)lights.push([x,y,3.6]);continue}}
    ctx.globalAlpha=TRANSP[v]||1;ctx.drawImage(v===13?(((fr>>3)+x*3+y)&1?tex.llama2:tex[13]):v===7?olas:cara(v,i),x*S,y*S,S,S);ctx.globalAlpha=1;
    if(v===7&&y>0&&!grid[i-COLS]){ctx.fillStyle='rgba(214,236,255,.5)';ctx.fillRect(x*S,y*S,S,Math.max(2,Math.round(S/16)))} // la superficie del agua: una línea clara donde encima hay aire
    if(v===13){lights.push([x,y,3.6]);if(Math.random()<.02)particles.push({x:x+.42+Math.random()*.16,y:y+.2,vx:(Math.random()-.5)*.012,vy:-.05,life:22,col:'#ffd43b'})}
    else if(v===9&&na>.05){ctx.fillStyle=`rgba(255,214,90,${.5*na})`;ctx.fillRect(x*S,y*S,S,S);lights.push([x,y,1.6])}
    else if(v!==11&&v!==7&&v!==9){ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(x*S,y*S+S-2,S,2)}}
  // Los bloques recién puestos entran con un saltito: nacen algo más pequeños, se pasan un pelín de su tamaño y se asientan (menos de dos décimas de segundo).
  // Se pintan los últimos para que, mientras se pasan, queden por encima de sus vecinos.
  if(saltan)for(let k=0;k<saltan.length;k+=4){const x=saltan[k],y=saltan[k+1],v=saltan[k+2],u=saltan[k+3]-1,d=Math.round(S*(.55+.45*(1+3.6*u*u*u+2.6*u*u))),o=Math.round((S-d)/2);
    ctx.globalAlpha=TRANSP[v]||1;ctx.drawImage(v===7?olas:cara(v,idx(x,y)),x*S+o,y*S+o,d,d);ctx.globalAlpha=1}
  // juntar: un + entre las dos torres y un marco amarillo en los bloques que ya se han contado
  if(reto&&reto.kind==='junta'&&!reto.won){const r=reto,px=(r.cs+1.5)*S,py=(r.bs-(Math.max(r.a,r.bq)-1)/2+.5)*S,l=S*.32,g=S*.09;
    ctx.fillStyle='rgba(42,29,20,.6)';ctx.fillRect(px-l+3,py-g+3,2*l,2*g);ctx.fillRect(px-g+3,py-l+3,2*g,2*l);
    ctx.fillStyle='#fff6e0';ctx.fillRect(px-l,py-g,2*l,2*g);ctx.fillRect(px-g,py-l,2*g,2*l);
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=4;r.cont.forEach(k=>{const [x,y]=k.split(',').map(Number);ctx.strokeRect(x*S+2,y*S+2,S-4,S-4)})}
  // copia: el modelo en un marco liso, una flecha y, al lado, el cuadro amarillo donde hay que hacerlo igual
  if(reto&&reto.kind==='copia'&&!reto.won){const r=reto,py=r.y0*S-4,pw=r.w*S+8,ph=r.h*S+8,u=S/8,ax=(r.cs+r.w)*S,ay=(r.y0+r.h/2)*S;
    marco(r.cs*S-4,py,pw,ph,'#fff6e0');marco(r.zx*S-4,py,pw,ph,'#ffd43b',[8,6]);
    ctx.fillStyle='#fff6e0';ctx.fillRect(ax+u*1.5,ay-u/2,u*3,u);ctx.beginPath();ctx.moveTo(ax+u*4.5,ay-u*1.5);ctx.lineTo(ax+u*6.5,ay);ctx.lineTo(ax+u*4.5,ay+u*1.5);ctx.fill();
    // pista: en el modelo parpadea el bloque que toca copiar
    r.ghost.forEach(g=>{if(g.miss<2||grid[idx(g.x,g.y)]===g.b)return;
      ctx.globalAlpha=.55+.45*Math.sin(fr/8);ctx.strokeStyle='#ffd43b';ctx.lineWidth=4;ctx.strokeRect(g.mx*S+2,g.my*S+2,S-4,S-4);ctx.globalAlpha=1})}
  // huecos de la serie, de la copia o de la letra por rellenar
  if(reto&&reto.ghost&&!reto.won)reto.ghost.forEach(g=>{if(lleno(g))return;
    if(reto.kind==='letra'){ctx.fillStyle='rgba(255,246,224,.5)';ctx.fillRect(g.x*S,g.y*S,S,S)} // la letra, en blanco suave: como las de repasar
    if(g.miss>=2&&g.b){ctx.globalAlpha=.4;ctx.drawImage(tex[g.b],g.x*S,g.y*S,S,S)}
    ctx.globalAlpha=.65+.3*Math.sin(fr/10);ctx.strokeStyle='#fff6e0';ctx.lineWidth=3;ctx.setLineDash([6,5]);
    ctx.strokeRect(g.x*S+3,g.y*S+3,S-6,S-6);ctx.setLineDash([]);
    if(g.miss<2&&reto.kind==='serie'){ctx.fillStyle='#fff6e0';ctx.font=`${S*.4}px "Press Start 2P",monospace`;ctx.textAlign='center';ctx.fillText('?',g.x*S+S/2,g.y*S+S*.72);ctx.textAlign='start'}
    ctx.globalAlpha=1});
  // cerditos (de noche duermen)
  const asleep=na>.6;
  pigs.forEach(p=>{
    p.t++;if(p.joy>0)p.joy--;
    p.vy=Math.min(p.vy+.0125,.25);let ny=p.y+p.vy;
    const cx=Math.floor(p.x+.5);
    if(p.vy>0&&solid(cx,Math.floor(ny+.98))){ny=Math.floor(ny+.98)-1;p.vy=0}
    if(p.vy<0&&solid(cx,Math.floor(ny))){ny=Math.floor(ny)+1;p.vy=0}
    p.y=ny;
    if(!asleep||p.joy>0){
      if(Math.random()<.004)p.vx*=-1;
      const nx=p.x+p.vx,front=Math.floor(nx+(p.vx>0?.9:.1)),row=Math.floor(p.y+.5);
      if(solid(front,row)){if(!solid(front,row-1)&&p.vy===0)p.vy=-.16;else p.vx*=-1}else p.x=nx;
    }
    drawPig(p,asleep&&p.joy<=0)});
  // trocitos y fuegos artificiales
  particles=particles.filter(q=>{
    if(q.txt){q.y-=.016;q.life--;ctx.font=`${S*.55}px "Press Start 2P",monospace`;ctx.textAlign='center';ctx.globalAlpha=Math.min(1,q.life/15);
      ctx.fillStyle='#2a1d14';ctx.fillText(q.txt,q.x*S+3,q.y*S+3);ctx.fillStyle='#ffd43b';ctx.fillText(q.txt,q.x*S,q.y*S);ctx.globalAlpha=1;ctx.textAlign='start';return q.life>0}
    q.vy+=.0075;q.x+=q.vx;q.y+=q.vy;q.life--;
    if(q.col){ctx.fillStyle=q.col;ctx.fillRect(q.x*S,q.y*S,S/6,S/6)}
    else{if(q.life<8)ctx.globalAlpha=q.life/8;ctx.drawImage(tex[q.id],q.sx,q.sy,8,8,q.x*S,q.y*S,S*.28,S*.28);ctx.globalAlpha=1}return q.life>0});
  ctx.restore();

  // oscuridad de la noche, con luz de antorchas y ventanas
  if(na>.02){
    if(!lights.length){ctx.fillStyle=`rgba(8,12,48,${.6*na})`;ctx.fillRect(0,0,W,H)} // sin luces a la vista no hace falta el lienzo aparte
    else{
      lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,light.width,light.height);lctx.fillStyle=`rgba(8,12,48,${.6*na})`;lctx.fillRect(0,0,light.width,light.height);
      lctx.globalCompositeOperation='destination-out';
      lights.forEach(([x,y,r])=>{const lx=(x+.5-camC)*S/LQ,ly=((y+.5)*S+offY)/LQ,rr=r*S*(1+.04*Math.sin(fr/6+x))/LQ;lctx.drawImage(luzSpr.hueco,lx-rr,ly-rr,rr*2,rr*2)});
      // y alrededor de cada antorcha, un resplandor cálido que tiembla un poco (en el mismo lienzo pequeño: a pantalla completa solo se pinta una capa, haya las antorchas que haya)
      lctx.globalCompositeOperation='source-over';lctx.globalAlpha=na;
      lights.forEach(([x,y,r])=>{if(r<3)return;const lx=(x+.5-camC)*S/LQ,ly=((y+.4)*S+offY)/LQ,rr=r*S*(.92+.06*Math.sin(fr/5+x*2))/LQ;lctx.drawImage(luzSpr.calida,lx-rr,ly-rr,rr*2,rr*2)});
      lctx.globalAlpha=1;
      ctx.drawImage(light,0,0,light.width*LQ,light.height*LQ); // ampliada tal cual, sin suavizar: es bastante más rápido y en una mancha tan difusa no se ve la diferencia
    }
  }
  // deslizadores: qué trozo del mundo se ve, a lo ancho (abajo) y a lo alto (a la derecha). El mundo se mueve arrastrando el dedo;
  // las barras solo aparecen mientras se mueve y se apagan solas
  if(barCam===null)barCam=[camC,camR];
  if(Math.abs(camC-barCam[0])>.002||Math.abs(camR-barCam[1])>.002){barA=2;barCam=[camC,camR]}else if(barA>0)barA-=.03;
  if(barA>0){ctx.globalAlpha=Math.min(1,barA);
    if(maxC>0){const x0=16,w=W-40,y=H-16,tw=Math.max(28,w*(W/S)/COLS);
      ctx.fillStyle='rgba(42,29,20,.6)';ctx.fillRect(x0-2,y-2,w+4,10);ctx.fillStyle='#fff6e0';ctx.fillRect(x0+(w-tw)*camC/maxC,y,tw,6)}
    if(maxR>0){const y0=16,hh=H-48,x=W-16,th=Math.max(28,hh*(H/S)/ROWS);
      ctx.fillStyle='rgba(42,29,20,.6)';ctx.fillRect(x-2,y0-2,10,hh+4);ctx.fillStyle='#fff6e0';ctx.fillRect(x,y0+(hh-th)*camR/maxR,6,th)}
    ctx.globalAlpha=1}
  requestAnimationFrame(tick);
}

zoomAhora=[0,1,2].includes(vcfg.zoom)?vcfg.zoom:1;
window.addEventListener('resize',resize);
resize();
if(!load())genWorld();
clampCam();marcaSon();$('starN').textContent=stars;$('tNight').textContent=night?'☀️':'🌙';
requestAnimationFrame(tick);

// para las pruebas automáticas (abriendo la página con ?prueba): dónde está mirando la vista
if(/[?&]prueba/.test(location.search))window.__juego={cam:()=>({camC,camR,S,W,H,offY,zoom:zoomAhora,auto:zoomAuto}),reto:()=>reto&&{kind:reto.kind,cont:(reto.cont||[]).length,err:reto.err||0},retoFull:()=>reto,suena,pops:()=>pops.size,audio0:()=>{ac=null},partes:()=>particles.length,texV:()=>texV,agua:()=>agua,amanece:c=>amanece(c),reac:n=>{for(let k=0;k<n;k++)reacciona()},grid:()=>grid,reacOn:v=>{reacOff=!v},pigs:()=>pigs};

// sin conexión: el service worker guarda el juego entero (página, fuente e iconos)
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
